[project]
name = "story-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "numpy<2",
    "onnx>=1.23.0",
    "onnxruntime-gpu==1.26.0",
    "opencv-python>=4.11.0.86",
    "paddleocr>=3.7.0",
    "pyclipper>=1.4.0",
    "pydantic>=2.13.5",
    "qwen-vl-utils>=0.0.14",
    "setuptools<81",
    "shapely>=2.1.2",
    "torch==2.5.1",
    "torchsummary>=1.5.1",
    "torchvision==0.20.1",
    "tqdm>=4.66.5",
    "transformers>=4.57.0",
    "wandb>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
api = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30,<1",
]
manga-layout = [
    "ultralytics>=8.3.0,<9.0.0",
]
research = [
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.ruff.lint]
# tools/ scripts manipulate sys.path before app imports — E402 is expected there.
per-file-ignores = { "tools/*.py" = ["E402"] }
