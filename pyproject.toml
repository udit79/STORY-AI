[project]
name = "story-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy<2",
    "onnx>=1.23.0",
    "onnxruntime-gpu==1.26.0",
    "opencv-python>=4.11.0.86",
    "paddleocr>=3.7.0",
    "pyclipper>=1.4.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "rapidfuzz>=3.14.6",
    "ruff>=0.16.9",
    "setuptools<81",
    "shapely>=2.1.2",
    "torch==2.5.1",
    "torchsummary>=1.5.1",
    "torchvision==0.20.1",
    "tqdm>=4.66.5",
    "wandb>=0.30.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
